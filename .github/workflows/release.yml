name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build archive
        run: |
          xcodebuild archive \
            -project FlowX.xcodeproj \
            -scheme FlowX \
            -archivePath build/FlowX.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0

      - name: Export app
        run: |
          mkdir -p export
          cp -R build/FlowX.xcarchive/Products/Applications/FlowX.app export/

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "FlowX" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 80 \
            --icon "FlowX.app" 180 200 \
            --app-drop-link 480 200 \
            --hide-extension "FlowX.app" \
            "FlowX-${{ github.ref_name }}.dmg" \
            "export/"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: FlowX-${{ github.ref_name }}.dmg
          generate_release_notes: true
